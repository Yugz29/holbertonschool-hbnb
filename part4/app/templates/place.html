<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="container header-container">
            <div class="header-logo">
                <a href="{{ url_for('index_page') }}">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="HBnB Logo" class="logo">
                </a>
            </div>
            <nav class="header-nav">
                <a id="login-link" href="{{ url_for('login_page') }}" class="login-button auth-btn">Login</a>
                <button id="logout-btn" class="auth-btn" style="display:none;">Log Out</button>
            </nav>
        </div>
    </header>
    
    <main>
        <!-- Section détails du lieu avec les classes requises -->
        <section id="place-details" class="place-details">
            <div class="place-info">
                <!-- Les infos du lieu seront injectées ici par JS -->
            </div>
        </section>
        
        <!-- Section des reviews -->
        <section id="reviews" class="reviews-section">
            <h3>Reviews</h3>
            <div id="reviews-list">
                <!-- Les review-card seront injectées ici par JS -->
            </div>
        </section>
        
        <!-- Section ajout de review (visible uniquement si connecté) -->
        <section id="add-review-container" class="add-review-section">
            <button id="add-review-button" class="add-review-btn">Add Review</button>
            <div id="review-form-container" class="review-form-container"></div>
        </section>
    </main>
    
    <footer class="footer">
        <div class="container">
            <p>© 2025 HBnB. All rights reserved.</p>
        </div>
    </footer>
    
    <script src="{{ url_for('static', filename='js/place.js') }}"></script>
</body>
</html>
