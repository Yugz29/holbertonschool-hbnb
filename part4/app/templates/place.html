<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="container header-container">
            <div class="header-logo">
                <a href="{{ url_for('index_page') }}">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="HBnB Logo" class="logo">
                </a>
            </div>
            <nav class="header-nav">
                <a href="{{ url_for('login_page') }}" class="login-button">Login</a>
            </nav>
        </div>
    </header>
    <main>
        <section id="place-details" class="place-details">
            <!-- Content will be dynamically injected by JS -->
        </section>
        <section id="reviews">
            <!-- Reviews will be dynamically injected by JS -->
        </section>
        <div id="add-review-container" style="text-align:center; margin-top:30px;">
            <button id="add-review-button" style="display:none;">Add Review</button>
            <div id="review-form-container" style="display:none; margin-top:15px;">
                <form id="review-form" action="#" onsubmit="return false;">
                    <label for="review-text">Review:</label><br>
                    <textarea id="review-text" name="review-text" required></textarea><br><br>

                    <label for="review-rating">Rating:</label><br>
                    <select id="review-rating" name="review-rating" required>
                        <option value="">--Select rating--</option>
                        <option value="1">★</option>
                        <option value="2">★★</option>
                        <option value="3">★★★</option>
                        <option value="4">★★★★</option>
                        <option value="5">★★★★★</option>
                    </select><br><br>

                    <button type="submit">Submit Review</button>
                </form>
            </div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2025 HBnB. All rights reserved.</p>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='js/place.js') }}"></script>
</body>
</html>
