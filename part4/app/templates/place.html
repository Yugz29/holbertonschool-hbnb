<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="container header-container">
            <div class="header-logo">
                <a href="{{ url_for('index_page') }}">
                    <img src="{{ url_for('static', filename='images/logo.png') }}" alt="HBnB Logo" class="logo">
                </a>
            </div>
            <nav class="header-nav">
                <a id="login-link" href="{{ url_for('login_page') }}" class="login-button auth-btn">Login</a>
                <button id="logout-btn" class="auth-btn" style="display:none;">Log Out</button>
            </nav>
        </div>
    </header>
    <main>
        <section id="place-details" class="place-details">
            <!-- Content will be dynamically injected by JS -->
        </section>
        <section id="reviews">
            <!-- Reviews will be dynamically injected by JS -->
        </section>
        <div id="add-review-container" style="text-align:center; margin-top:30px;">
            <button id="add-review-button" class="add-review-btn" style="display:none;">Add Review</button>
            <div id="review-form-container" style="display:none;"></div>
        </div>
    </main>
    <footer class="footer">
        <div class="container">
            <p>© 2025 HBnB. All rights reserved.</p>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='js/place.js') }}"></script>
</body>
</html>
